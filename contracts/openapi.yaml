components:
  securitySchemes:
    sessionCookie:
      type: "apiKey"
      in: "cookie"
      name: "eagles-eye-optics-medical-session"
      description: "Session Sanctum du seul sous-domaine applicatif (cookie Secure, HttpOnly, SameSite=Lax). Le nom suit SESSION_COOKIE."
    xsrfToken:
      type: "apiKey"
      in: "header"
      name: "X-XSRF-TOKEN"
      description: "Jeton CSRF lu dans le cookie XSRF-TOKEN ; une écriture marquée Sec-Fetch-Site: same-origin est aussi acceptée (Fetch Metadata)."
  parameters:
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: true
      description: "ULID de l'intention : même clé et même contenu = résultat durable existant ; même clé et contenu différent = 409 IDEMPOTENCY_PAYLOAD_MISMATCH ; une nouvelle intention reçoit une nouvelle clé."
      schema:
        $ref: "./schemas/common.json#/$defs/Ulid"
  responses:
    BadRequest:
      description: "Requête refusée (par exemple SESSION_REQUIRED : origine non reconnue)."
      content:
        application/json:
          schema:
            $ref: "./schemas/error.json"
    Unauthorized:
      description: "AUTH_REQUIRED : reconnexion, saisies conservées."
      content:
        application/json:
          schema:
            $ref: "./schemas/error.json"
    Forbidden:
      description: "ACTION_FORBIDDEN : droit insuffisant, sans divulguer la cible."
      content:
        application/json:
          schema:
            $ref: "./schemas/error.json"
    NotFound:
      description: "RESOURCE_NOT_FOUND : inexistante ou inaccessible (autre cabinet)."
      content:
        application/json:
          schema:
            $ref: "./schemas/error.json"
    Conflict:
      description: "VERSION_CONFLICT, STATE_TRANSITION_REFUSED, PAYMENT_EXCEEDS_BALANCE, STOCK_UNAVAILABLE, IDEMPOTENCY_PAYLOAD_MISMATCH, SLOT_UNAVAILABLE ou garde-fou métier."
      content:
        application/json:
          schema:
            $ref: "./schemas/error.json"
    Gone:
      description: "Ressource expirée (export)."
      content:
        application/json:
          schema:
            $ref: "./schemas/error.json"
    PayloadTooLarge:
      description: "Taille au-delà des limites du contrat 23."
      content:
        application/json:
          schema:
            $ref: "./schemas/error.json"
    SessionExpired:
      description: "SESSION_CONTEXT_EXPIRED : renouveler session/CSRF et rejouer la même commande idempotente."
      content:
        application/json:
          schema:
            $ref: "./schemas/error.json"
    ValidationFailed:
      description: "VALIDATION_FAILED, EXAM_PAYMENT_REQUIRED, APPROVAL_REQUIRED_OR_EXPIRED, LOT_EXPIRED…"
      content:
        application/json:
          schema:
            $ref: "./schemas/error.json"
    ReauthenticationRequired:
      description: "REAUTHENTICATION_REQUIRED : confirmer le mot de passe."
      content:
        application/json:
          schema:
            $ref: "./schemas/error.json"
    RateLimited:
      description: "RATE_LIMITED : attendre (en-tête Retry-After), sans rejouer un paiement sans clé."
      content:
        application/json:
          schema:
            $ref: "./schemas/error.json"
    Unavailable:
      description: "CLINIC_NOT_CONFIGURED ou DEPENDENCY_UNAVAILABLE."
      content:
        application/json:
          schema:
            $ref: "./schemas/error.json"
