  /v1/sync/push:
    post:
      operationId: "PushCommands"
      summary: "Transmettre un lot ordonné de commandes signées"
      tags:
        - "Postes et synchronisation"
      description: "Module offline. Session d'un compte préparé sur ce poste (grant de ce poste) ou de la gérante (offline.enroll) ; poste perdu ou remplacé : 403. Chaque commande est vérifiée avant stockage (event_hash = SHA-256 du JCS du cœur, JWS ES256 de la clé enrôlée, kid = empreinte RFC 7638, lot contigu et chaîné) : sinon 422 SYNC_INTEGRITY_FAILED et rien n'est stocké ; même command_id avec une autre empreinte : 409 IDEMPOTENCY_PAYLOAD_MISMATCH ; rang précédent jamais reçu : 409 SYNC_SEQUENCE_GAP (details.expected_sequence) ; lot trop gros : 413 PAYLOAD_TOO_LARGE. Chaque commande est ensuite appliquée dans l'ordre, dans sa transaction, par le chemin central (source SYNC, autorisation historique de son grant, numéro de sa plage jamais renuméroté) ; l'application s'arrête au premier non finalisé. ACK par commande ; timeout = rejouer les mêmes identifiants (ALREADY_ACCEPTED, aucun second fait)."
      security:
        - sessionCookie: []
          xsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
